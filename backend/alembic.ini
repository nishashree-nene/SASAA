# ============================================================
# Alembic Configuration File
# ============================================================
# This file configures Alembic – the database migration tool.
#
# HOW ALEMBIC WORKS (beginner explanation):
#   Every time you change a SQLAlchemy model (add a column, rename a table,
#   add a new table), you run:
#       alembic revision --autogenerate -m "describe what changed"
#   Alembic compares your current models against the live database and
#   generates a Python migration script in alembic/versions/.
#   You then run:
#       alembic upgrade head
#   to apply those changes to the database.
#
# IMPORTANT: Run all alembic commands from the backend/ directory.

[alembic]
# Location of the migration scripts
script_location = alembic

# Where Alembic keeps track of which migrations have run.
# This table is created automatically in your database.
version_table = alembic_version

# The database URL.
# IMPORTANT: This is overridden at runtime by env.py reading from .env
# so the real password is never stored in this file.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
